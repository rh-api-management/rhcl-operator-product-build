apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/rh-api-management/rhcl-operator-product-build?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "rhcl-1.5" && ( "helm-chart-stage/**".pathChanged() || "helm-chart-generation/**".pathChanged() || ".tekton/rhcl-1-5-rhcl-operator-helm-chart-stage-push.yaml".pathChanged() || ".tekton/helm-chart-build-pipeline.yaml".pathChanged() )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: rhcl-1-5-rhcl-operator
    appstudio.openshift.io/component: rhcl-1-5-rhcl-operator-helm-chart-stage
    pipelines.appstudio.openshift.io/type: build
  name: rhcl-1-5-rhcl-operator-helm-chart-stage-on-push
  namespace: api-management-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/api-management-tenant/rhcl-1-5-rhcl-operator-helm-chart-stage:{{revision}}
  - name: chart-context
    value: helm-chart-stage/
  - name: chart-version
    value: "1.5.0"
  pipelineRef:
    name: helm-chart-build-pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhcl-1-5-rhcl-operator-helm-chart-stage
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
