name: Generate Component Charts

on:
  pull_request:
    paths:
      - 'bundle-generation/image-pullspecs/dns-operator.yaml'
      - 'bundle-generation/rhcl-operator.yaml'
      - 'component-charts-generation/**'
      - 'kuadrant-operator'
      - 'kuadrant-operator/component-charts/**'
    branches:
      - 'rhcl-*'
  push:
    paths:
      - 'bundle-generation/image-pullspecs/dns-operator.yaml'
      - 'bundle-generation/rhcl-operator.yaml'
      - 'component-charts-generation/**'
      - 'kuadrant-operator'
      - 'kuadrant-operator/component-charts/**'
    branches:
      - 'rhcl-*'
  workflow_dispatch: # Allow manual triggering

permissions:
  # Give the default GITHUB_TOKEN write permission to commit and push the
  # added or changed files to the repository.
  contents: write
  pull-requests: write

jobs:
  generate-component-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate component charts
        run: make component-charts

      - name: Check if the generated output differs from what's already committed
        id: changes
        run: |
          if git diff --quiet ./component-charts && \
             [ -z "$(git ls-files --other --exclude-standard --directory --no-empty-directory ./component-charts)" ]; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Generate downstream component charts after change to upstream charts or image-pullspecs
          file_pattern: 'component-charts/'

      - name: Validate component charts
        run: make validate-component-charts

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ${{ steps.changes.outputs.changes == 'true'
              && '✅ Component charts have been regenerated, committed, and validated successfully.'
              || '✅ Component charts are already up to date and validated successfully.' }}
