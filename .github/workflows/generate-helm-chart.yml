name: Generate Helm Chart

on:
  pull_request:
    paths:
      - 'bundle-generation/image-pullspecs/**'
      - 'bundle-generation/rhcl-operator.yaml'
      - 'helm-chart-generation/**'
      - 'kuadrant-operator'
      - 'kuadrant-operator/charts/kuadrant-operator/**'
    branches:
      - 'rhcl-*'
  push:
    paths:
      - 'bundle-generation/image-pullspecs/**'
      - 'bundle-generation/rhcl-operator.yaml'
      - 'helm-chart-generation/**'
      - 'kuadrant-operator'
      - 'kuadrant-operator/charts/kuadrant-operator/**'
    branches:
      - 'rhcl-*'
  workflow_dispatch: # Allow manual triggering

permissions:
  # Give the default GITHUB_TOKEN write permission to commit and push the
  # added or changed files to the repository.
  contents: write
  pull-requests: write

jobs:
  generate-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate helm charts
        run: make helm-chart

      - name: Check if the generated output differs from what's already committed
        id: changes
        run: |
          if git diff --quiet ./helm-chart ./helm-chart-dev ./helm-chart-stage && \
             [ -z "$(git ls-files --other --exclude-standard --directory --no-empty-directory ./helm-chart ./helm-chart-dev ./helm-chart-stage)" ]; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Generate downstream helm charts after change to upstream charts or image-pullspecs
          file_pattern: 'helm-chart/ helm-chart-dev/ helm-chart-stage/'

      - name: Validate helm charts
        run: make validate-helm-chart

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ${{ steps.changes.outputs.changes == 'true'
              && '✅ Helm charts have been regenerated, committed, and validated successfully.'
              || '✅ Helm charts are already up to date and validated successfully.' }}
